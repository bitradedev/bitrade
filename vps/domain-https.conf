server {
    listen 443 ssl;
    server_name origin.bitrade.site;

    ssl_certificate /etc/letsencrypt/live/bitrade-origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitrade-origin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/bitrade/proxy-auth.conf;

    location ~ ^/(api/|mcp$) {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host bitrade.site;
        proxy_set_header X-Real-IP $http_x_bitrade_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 5m;
    }

    location / {
        return 404;
    }
}
